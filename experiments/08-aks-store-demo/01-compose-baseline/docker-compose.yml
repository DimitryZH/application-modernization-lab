services:
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.112.0
    restart: always
    command: ["--username", "username", "--password", "password"]
    healthcheck:
      test: ["CMD-SHELL", "echo | openssl s_client -connect localhost:10260 -brief 2>&1 | grep -q 'CONNECTION ESTABLISHED'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - backend_services
  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    restart: always
    environment:
      - "RABBITMQ_DEFAULT_USER=username"
      - "RABBITMQ_DEFAULT_PASS=password"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend_services
  order-service:
    build: src/order-service
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-O",
          "/dev/null",
          "-q",
          "http://order-service:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - ORDER_QUEUE_HOSTNAME=rabbitmq
      - ORDER_QUEUE_PORT=5672
      - ORDER_QUEUE_USERNAME=username
      - ORDER_QUEUE_PASSWORD=password
      - ORDER_QUEUE_NAME=orders
    networks:
      - backend_services
    depends_on:
      rabbitmq:
        condition: service_healthy
  makeline-service:
    build: src/makeline-service
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-O",
          "/dev/null",
          "-q",
          "http://makeline-service:3001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - ORDER_QUEUE_URI=amqp://rabbitmq:5672
      - ORDER_QUEUE_USERNAME=username
      - ORDER_QUEUE_PASSWORD=password
      - ORDER_QUEUE_NAME=orders
      - ORDER_DB_URI=mongodb://documentdb:10260/?tls=true&tlsAllowInvalidCertificates=true
      - ORDER_DB_NAME=orderdb
      - ORDER_DB_COLLECTION_NAME=orders
      - ORDER_DB_USERNAME=username
      - ORDER_DB_PASSWORD=password
    networks:
      - backend_services
    depends_on:
      rabbitmq:
        condition: service_healthy
      documentdb:
        condition: service_healthy
  product-service:
    build: src/product-service
    restart: always
    environment:
      - AI_SERVICE_URL=http://ai-service:5001/
    networks:
      - backend_services
  store-front:
    build: src/store-front
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        ["CMD", "wget", "-O", "/dev/null", "-q", "http://store-front:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend_services
    depends_on:
      - product-service
      - order-service
  store-admin:
    build: src/store-admin
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        ["CMD", "wget", "-O", "/dev/null", "-q", "http://store-admin:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend_services
    depends_on:
      - product-service
      - makeline-service
  virtual-customer:
    build: src/virtual-customer
    restart: always
    environment:
      - ORDER_SERVICE_URL=http://order-service:3000/
      - ORDERS_PER_HOUR=1
    networks:
      - backend_services
    depends_on:
      order-service:
        condition: service_healthy
  virtual-worker:
    build: src/virtual-worker
    restart: always
    environment:
      - MAKELINE_SERVICE_URL=http://makeline-service:3001
      - ORDERS_PER_HOUR=1
    networks:
      - backend_services
    depends_on:
      makeline-service:
        condition: service_healthy
  ai-service:
    profiles:
      - ai
    build: src/ai-service
    restart: always
    ports:
      - "127.0.0.1:5001:5001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-O",
          "/dev/null",
          "-q",
          "http://ai-service:5001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - USE_AZURE_OPENAI=True
      - AZURE_OPENAI_API_VERSION=2024-12-01-preview
      - AZURE_OPENAI_DEPLOYMENT_NAME= # required if using Azure OpenAI
      - AZURE_OPENAI_ENDPOINT= # required if using Azure OpenAI
      - AZURE_OPENAI_API_KEY= # required if using Azure OpenAI key auth (not needed with workload identity)
      - AZURE_OPENAI_IMAGE_API_VERSION=2025-04-01-preview
      - AZURE_OPENAI_IMAGE_DEPLOYMENT_NAME= # required for image generation
      - AZURE_OPENAI_IMAGE_ENDPOINT= # optional override; defaults to AZURE_OPENAI_ENDPOINT
    networks:
      - backend_services
networks:
  backend_services:
    driver: bridge
