{{ define "recommendations" }}
<section class="recommendations section container" aria-labelledby="recommendations-title"><div class="section-heading"><div><p class="eyebrow">KEEP EXPLORING</p><h2 id="recommendations-title">Good company for your gear</h2></div></div><div class="recommendations-grid">{{ range .recommendations }}<a class="recommendation-card" href="{{ $.baseUrl }}/product/{{ .Id }}"><img src="{{ $.baseUrl }}{{ .Picture }}" alt="{{ .Name }}" loading="lazy" width="1254" height="1254"><h3>{{ .Name }}</h3></a>{{ end }}</div></section>
{{ end }}
