{{ define "error" }}
{{ template "header" . }}
<main id="main-content" class="error-page container"><section class="error-panel panel" aria-labelledby="error-title"><p class="eyebrow">A SMALL DETOUR</p><h1 id="error-title">We hit a rough patch.</h1><p>We couldn't complete that request. Check your details or head back to the gear.</p><p class="error-status">HTTP {{ .status_code }} · {{ .status }}</p><details class="error-details"><summary>Request details</summary><pre>{{ .error }}</pre></details><a class="button button-primary" href="{{ $.baseUrl }}/#shop">Back to the trail →</a></section></main>
{{ template "footer" . }}
{{ end }}
