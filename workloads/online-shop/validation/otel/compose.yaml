      OTEL_METRIC_EXPORT_INTERVAL: '1000'
      OTEL_EXPORTER_OTLP_TIMEOUT: '2000'
      OTEL_SERVICE_NAME: recommendationservice
      PORT: '8080'
      PRODUCT_CATALOG_SERVICE_ADDR: faults:50051
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
