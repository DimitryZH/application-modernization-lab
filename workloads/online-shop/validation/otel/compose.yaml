services:
  frontend:
    image: online-shop-21-frontend:local
    build:
      context: ../../src/frontend
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-development}
    environment:
      ONLINE_SHOP_TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      ONLINE_SHOP_VERSION: ${SOURCE_REVISION:-development}
      ONLINE_SHOP_ENVIRONMENT: local-validation
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: 'true'
      OTEL_TRACES_SAMPLER_ARG: ${SAMPLE_RATIO:-1}
      DISABLE_PROFILER: '1'
      ENABLE_PROFILER: '0'
      OTEL_BSP_MAX_QUEUE_SIZE: '512'
      OTEL_BSP_EXPORT_TIMEOUT: '2000'
      OTEL_METRIC_EXPORT_INTERVAL: '1000'
      OTEL_EXPORTER_OTLP_TIMEOUT: '2000'
      OTEL_SERVICE_NAME: frontend
      PORT: '8080'
      PRODUCT_CATALOG_SERVICE_ADDR: faults:50051
      CURRENCY_SERVICE_ADDR: faults:50051
      CART_SERVICE_ADDR: faults:50051
      RECOMMENDATION_SERVICE_ADDR: faults:50051
      SHIPPING_SERVICE_ADDR: faults:50051
      CHECKOUT_SERVICE_ADDR: faults:50051
      AD_SERVICE_ADDR: faults:50051
      SHOPPING_ASSISTANT_SERVICE_ADDR: faults:8081
      PACKAGING_SERVICE_URL: http://faults:8081
      ENABLE_ASSISTANT: 'false'
      ENV_PLATFORM: local
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    ports:
    - 127.0.0.1:${FRONTEND_PORT:-18080}:8080
  checkoutservice:
    image: online-shop-21-checkoutservice:local
