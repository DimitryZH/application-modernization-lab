  loadgenerator:
    image: online-shop-21-loadgenerator:local
    build:
      context: ../../src/loadgenerator
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-development}
    environment:
      ONLINE_SHOP_TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      ONLINE_SHOP_VERSION: ${SOURCE_REVISION:-development}
      ONLINE_SHOP_ENVIRONMENT: local-validation
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: 'true'
      OTEL_TRACES_SAMPLER_ARG: ${SAMPLE_RATIO:-1}
      DISABLE_PROFILER: '1'
      ENABLE_PROFILER: '0'
      OTEL_BSP_MAX_QUEUE_SIZE: '512'
      OTEL_BSP_EXPORT_TIMEOUT: '2000'
      OTEL_METRIC_EXPORT_INTERVAL: '1000'
      OTEL_EXPORTER_OTLP_TIMEOUT: '2000'
      OTEL_SERVICE_NAME: loadgenerator
      FRONTEND_ADDR: frontend:8080
      USERS: '2'
      RATE: '1'
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    profiles:
    - load
  redis-cart:
    image: redis:7.4.8-alpine
    command:
    - redis-server
    - --save
    - ''
    - --appendonly
    - 'no'
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    user: ${COLLECTOR_UID:-1000}:${COLLECTOR_GID:-1000}
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ./collector.yaml:/etc/otelcol/config.yaml:ro
    - ${EVIDENCE_DIR:-./output}/logs:/logs:ro
    - ${EVIDENCE_DIR:-./output}/telemetry:/telemetry
    stop_grace_period: 10s
  probe:
    build:
      context: .
      dockerfile: Dockerfile.probe
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-development}
    image: online-shop-21-probe:local
    profiles:
    - tools
    volumes:
    - ../../protos:/protos:ro
    - ${EVIDENCE_DIR:-./output}:/evidence
    environment:
      PYTHONUNBUFFERED: '1'
    entrypoint:
    - python
    - /validation/scenarios.py
  faults:
    image: online-shop-21-probe:local
    build:
      context: .
      dockerfile: Dockerfile.probe
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-development}
    entrypoint:
    - python
    - /validation/faults.py
