receivers:
  redis:
    endpoint: redis-cart:6379
    collection_interval: 1s
    timeout: 1s
    resource_attributes:
      server.address:
        enabled: true
      server.port:
        enabled: true
  filelog/redis:
    include: [/logs/redis.log]
    start_at: beginning
    operators:
    - type: regex_parser
      regex: '^(?P<pid>\d+):(?P<role>[A-Z]) (?P<timestamp>\d+ \w+ \d+ \d+:\d+:\d+\.\d+) (?P<level>[.*#-]) (?P<message>.*)$'
      timestamp:
        parse_from: attributes.timestamp
        layout_type: gotime
        layout: '02 Jan 2006 15:04:05.000'
    - type: move
      from: attributes.message
      to: body
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  filelog:
    include:
    - /logs/*.jsonl
    start_at: beginning
    operators:
    - type: json_parser
      parse_to: attributes
      on_error: send_quiet
      timestamp:
        parse_from: attributes.timestamp
        layout_type: gotime
        layout: '2006-01-02T15:04:05.999999999Z07:00'
      severity:
        parse_from: attributes.severity
      trace:
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
processors:
  resource/redis:
    attributes:
    - {key: service.name, value: redis-cart, action: upsert}
    - {key: service.namespace, value: online-shop, action: upsert}
    - {key: service.instance.id, value: '${env:REDIS_INSTANCE}', action: upsert}
    - {key: deployment.environment.name, value: local-validation, action: upsert}
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  transform/logs:
    error_mode: ignore
    log_statements:
    - context: log
      statements:
      - set(body, attributes["message"])
  batch:
    timeout: 1s
    send_batch_size: 128
  groupbyattrs/services:
    keys:
    - service.name
    - service.namespace
    - service.version
exporters:
  file/traces:
    path: /telemetry/traces.jsonl
  file/metrics:
    path: /telemetry/metrics.jsonl
  file/logs:
    path: /telemetry/logs.jsonl
service:
  pipelines:
    metrics/redis:
      receivers: [redis]
      processors: [memory_limiter, resource/redis, batch]
      exporters: [file/metrics]
    logs/redis:
      receivers: [filelog/redis]
      processors: [memory_limiter, resource/redis, batch]
      exporters: [file/logs]
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch
      exporters:
      - file/traces
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch
      exporters:
      - file/metrics
    logs:
      receivers:
      - filelog
      processors:
      - memory_limiter
      - groupbyattrs/services
      - transform/logs
      - batch
      exporters:
      - file/logs
